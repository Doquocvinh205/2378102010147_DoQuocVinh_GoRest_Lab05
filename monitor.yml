name: API Monitor (Shift-Right)

on:
  schedule:
    - cron: '0 * * * *'   # chạy mỗi giờ (giờ UTC)
  workflow_dispatch:       # cho phép bấm chạy tay

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Check GET /users (response time < 800ms)
        run: newman run Monitor.postman_collection.json --reporters cli
